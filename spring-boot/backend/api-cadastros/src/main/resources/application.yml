server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: starter-api-cadastros
  profiles:
    active: ${ENVIRONMENT:local}
  config:
    import: optional:file:${openbao.runtime-dir:/run/openbao}/config/application-runtime.yml
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: true
    properties:
      hibernate:
        format_sql: false
  liquibase:
    contexts: ${ENVIRONMENT}
  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: ${api.oauth.keycloak.url}/realms/${api.oauth.keycloak.realm}
          jwk-set-uri: ${api.oauth.keycloak.url}/realms/${api.oauth.keycloak.realm}/protocol/openid-connect/certs
  cloud:
    config:
      enabled: false
    openfeign:
      lazy-attributes-resolution: true
  freemarker:
    template-loader-path: classpath:/freemarker-templates/

logging:
  file:
    name: /servers/docker/app/files/logs/${spring.application.name}.log
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %clr([%X{uid}]){yellow} %m%n%wEx"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p --- [%15.15t] %-40.40logger{39} : [%X{uid}] %m%n%wEx"
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.metamodel.internal.MetadataContext: ERROR
    org.hibernate.persister.entity.AbstractEntityPersister: ERROR
    sql: DEBUG
    web: INFO
    org.springframework.modulith: DEBUG

otlp:
  exporter:
    endpoint: http://otel:4318

management:
  endpoints:
    jmx:
      exposure:
        include: '*'
    web:
      exposure:
        include: 'health,info,refresh'
  otlp:
    metrics:
      export:
        enabled: true
        url: ${otlp.exporter.endpoint}/v1/metrics
        step: 1m
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${otlp.exporter.endpoint}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${otlp.exporter.endpoint}/v1/logs
    resource-attributes:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT}
      namespace: ${NAMESPACE:starter}
  logging:
    export:
      enabled: true
  tracing:
    export:
      enabled: true
    sampling:
      probability: 0.2
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT}
      namespace: ${NAMESPACE:starter}
  observations:
    key-values:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT}
      namespace: ${NAMESPACE:starter}

springdoc:
  swagger-ui:
    path: /openapi/swagger-ui

openbao:
  runtime-dir: ${OPENBAO_RUNTIME_DIR:/run/openbao}

api:
  oauth:
    keycloak:
      role-map-keys:
        - "resource_access"
        - "realm_access"
        - "groups"
      gran-type: client_credentials
