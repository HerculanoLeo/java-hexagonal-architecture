extensions:
  basicauth/grafana_cloud:
    # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/extension/basicauthextension
    client_auth:
      username: "${env:GRAFANA_CLOUD_INSTANCE_ID}"
      password: "${env:GRAFANA_CLOUD_API_KEY}"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 1m
    container_labels_to_metric_labels:
      com.docker.compose.project: compose.project
    metrics:
      container.uptime:
        enabled: true

processors:
  batch:
  # https://github.com/open-telemetry/opentelemetry-collector/tree/main/processor/batchprocessor
  resource/common:
    attributes:
      - key: namespace
        value: "${env:NAMESPACE}"
        action: upsert
      - key: service.namespace
        value: "${env:NAMESPACE}"
        action: upsert
      - key: environment
        value: "${env:ENVIRONMENT}"
        action: upsert
  resourcedetection:
    # Enriches telemetry data with resource information from the host
    # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/resourcedetectionprocessor
    detectors: [ "env", "docker", "system" ]
    override: false
  transform/drop_unneeded_resource_attributes:
    # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/transformprocessor
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - delete_key(attributes, "k8s.pod.start_time")
          - delete_key(attributes, "os.description")
          - delete_key(attributes, "os.type")
          - delete_key(attributes, "process.command_args")
          - delete_key(attributes, "process.executable.path")
          - delete_key(attributes, "process.pid")
          - delete_key(attributes, "process.runtime.description")
          - delete_key(attributes, "process.runtime.name")
          - delete_key(attributes, "process.runtime.version")
    metric_statements:
      - context: resource
        statements:
          - delete_key(attributes, "k8s.pod.start_time")
          - delete_key(attributes, "os.description")
          - delete_key(attributes, "os.type")
          - delete_key(attributes, "process.command_args")
          - delete_key(attributes, "process.executable.path")
          - delete_key(attributes, "process.pid")
          - delete_key(attributes, "process.runtime.description")
          - delete_key(attributes, "process.runtime.name")
          - delete_key(attributes, "process.runtime.version")
    log_statements:
      - context: resource
        statements:
          - delete_key(attributes, "k8s.pod.start_time")
          - delete_key(attributes, "os.description")
          - delete_key(attributes, "os.type")
          - delete_key(attributes, "process.command_args")
          - delete_key(attributes, "process.executable.path")
          - delete_key(attributes, "process.pid")
          - delete_key(attributes, "process.runtime.description")
          - delete_key(attributes, "process.runtime.name")
          - delete_key(attributes, "process.runtime.version")
  transform/add_resource_attributes_as_metric_attributes:
    # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/transformprocessor
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["deployment.environment"], resource.attributes["deployment.environment"])
          - set(attributes["service.version"], resource.attributes["service.version"])
          - set(attributes["environment"], resource.attributes["environment"])
          - set(attributes["namespace"], resource.attributes["namespace"])
          - set(attributes["application"], resource.attributes["application"])
          - set(attributes["application"], resource.attributes["service.name"]) where attributes["application"] == nil
          - set(attributes["container.name"], resource.attributes["container.name"])
          - set(attributes["container.image"], resource.attributes["container.image"])
  filter/drop_actuator:
    traces:
      span:
        - attributes["http.route"] == "/actuator/prometheus"
        - attributes["http.route"] == "/actuator/health"
  filter/docker_compose_project:
    error_mode: ignore
    metrics:
      resource:
        - 'attributes["compose.project"] == nil or attributes["compose.project"] != "${env:COMPOSE_PROJECT_NAME}"'
  filter/keep_used_metrics:
    metrics:
      include:
        match_type: regexp
        metric_names:
          - "^(target_info|http_server_request|http_server_requests|http\\.server|http\\.server\\.requests|http\\.server\\.request|jvm|jvm_info|jvm\\.info|jvm_memory_used|jvm\\.memory\\.used|jvm_gc_pause|jvm\\.gc\\.pause|jvm_threads|jvm\\.threads|jvm_classes_loaded|jvm\\.classes\\.loaded|jvm_buffer_memory_used|jvm\\.buffer\\.memory\\.used|process_uptime|process\\.uptime|process_start_time|process\\.start\\.time|process_cpu_usage|process\\.cpu\\.usage|system_cpu_usage|system\\.cpu\\.usage|hikaricp_connections|hikaricp\\.connections|logback_events|logback\\.events|process_files|process\\.files|container_cpu|container\\.cpu|container_memory|container\\.memory|container_blockio|container\\.blockio|container_network|container\\.network|container_uptime|container\\.uptime|tomcat|catalina|db\\.client).*"

exporters:
  otlphttp/grafana_cloud:
    # https://github.com/open-telemetry/opentelemetry-collector/tree/main/exporter/otlphttpexporter
    endpoint: "${env:GRAFANA_CLOUD_OTLP_ENDPOINT}"
    auth:
      authenticator: basicauth/grafana_cloud

connectors:
  grafanacloud:
    # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/connector/grafanacloudconnector
    host_identifiers: [ "host.name" ]

service:
  extensions:
    [
      basicauth/grafana_cloud,
    ]
  pipelines:
    traces:
      receivers: [ otlp ]
      processors:
        [ resourcedetection, transform/drop_unneeded_resource_attributes, filter/drop_actuator, batch ]
      exporters: [ otlphttp/grafana_cloud, grafanacloud ]
    metrics:
      receivers: [ otlp ]
      processors:
        [
          resourcedetection,
          transform/drop_unneeded_resource_attributes,
          transform/add_resource_attributes_as_metric_attributes,
          batch,
        ]
      exporters: [ otlphttp/grafana_cloud ]
    metrics/docker:
      receivers: [ docker_stats ]
      processors:
        [
          filter/docker_compose_project,
          resource/common,
          resourcedetection,
          transform/drop_unneeded_resource_attributes,
          transform/add_resource_attributes_as_metric_attributes,
          filter/keep_used_metrics,
          batch,
        ]
      exporters: [ otlphttp/grafana_cloud ]
    metrics/grafanacloud:
      receivers: [ grafanacloud ]
      processors: [ batch ]
      exporters: [ otlphttp/grafana_cloud ]
    logs:
      receivers: [ otlp ]
      processors:
        [
          resourcedetection,
          transform/drop_unneeded_resource_attributes,
          batch,
        ]
      exporters: [ otlphttp/grafana_cloud ]